name: NF01 Phase N Cloud GUI Evidence

on:
  push:
    branches:
      - docs/nf-01-produto-design-system
    paths:
      - '.github/workflows/nf01-phase-n-cloud-gui.yml'
      - '.github/scripts/nf01-cloud-gui.mjs'
      - 'docs/nf-01/prototype/**'
      - 'docs/nf-01/validation/phase-n/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-gui-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/nf-01/validation/phase-n/package.json

      - name: Install validation dependencies
        working-directory: docs/nf-01/validation/phase-n
        run: npm install --no-audit --no-fund

      - name: Install Chromium and GUI accessibility tooling
        working-directory: docs/nf-01/validation/phase-n
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool dbus-x11 at-spi2-core orca speech-dispatcher imagemagick jq

      - name: Run headed browser + Orca evidence
        working-directory: docs/nf-01/validation/phase-n
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/docs/nf-01/evidence/phase-n/cloud-gui-run"
          mkdir -p "$EVIDENCE"
          export EVIDENCE DISPLAY=:99 XDG_RUNTIME_DIR=/tmp/nf01-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          safe_kill() {
            for pid in "$@"; do
              if [ -n "${pid:-}" ] && [ "$pid" -gt 1 ] 2>/dev/null && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
          }

          Xvfb :99 -screen 0 1920x1080x24 -ac > /tmp/nf01-xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'safe_kill "${XVFB_PID:-}"' EXIT
          sleep 2

          dbus-run-session -- bash <<'INNER'
          set -euo pipefail
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/nf01-runtime
          export GTK_MODULES=gail:atk-bridge
          export NO_AT_BRIDGE=0
          export EVIDENCE="$GITHUB_WORKSPACE/docs/nf-01/evidence/phase-n/cloud-gui-run"

          safe_kill() {
            for pid in "$@"; do
              if [ -n "${pid:-}" ] && [ "$pid" -gt 1 ] 2>/dev/null && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
          }

          openbox > /tmp/nf01-openbox.log 2>&1 &
          WM_PID=$!
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/docs/nf-01/prototype" > /tmp/nf01-http.log 2>&1 &
          SERVER_PID=$!
          ORCA_PID=""
          trap 'safe_kill "${ORCA_PID:-}" "${SERVER_PID:-}" "${WM_PID:-}"' EXIT
          sleep 2

          orca --replace --debug-file "$EVIDENCE/N3-orca-debug.log" > /tmp/nf01-orca-stdout.log 2>&1 &
          ORCA_PID=$!
          sleep 4

          cd "$GITHUB_WORKSPACE/docs/nf-01/validation/phase-n"
          node "$GITHUB_WORKSPACE/.github/scripts/nf01-cloud-gui.mjs"
          sleep 2

          safe_kill "$ORCA_PID"
          ORCA_PID=""
          sleep 1
          cp /tmp/nf01-xvfb.log "$EVIDENCE/runtime-xvfb.log" || true
          cp /tmp/nf01-openbox.log "$EVIDENCE/runtime-openbox.log" || true
          cp /tmp/nf01-http.log "$EVIDENCE/runtime-http.log" || true
          cp /tmp/nf01-orca-stdout.log "$EVIDENCE/runtime-orca-stdout.log" || true
          grep 'SPEECH OUTPUT' "$EVIDENCE/N3-orca-debug.log" > "$EVIDENCE/N3-orca-speech-output.log" || true

          python3 - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path(os.environ['EVIDENCE'])
          speech_file = evidence / 'N3-orca-speech-output.log'
          speech = speech_file.read_text(errors='ignore') if speech_file.exists() else ''
          expected = [
              'Dashboard',
              'Funcionários',
              'Novo Funcionário',
              'Resumo e controles do Design Lab',
              'Revise as informações desta etapa',
          ]
          result = {item: (item.lower() in speech.lower()) for item in expected}
          (evidence / 'orca-speech-assertions.json').write_text(json.dumps({
              'execution': 'CLOUD_ORCA_ASSISTED_EVIDENCE',
              'all_expected_announcements_found': all(result.values()),
              'assertions': result,
          }, indent=2, ensure_ascii=False))
          PY
          INNER

      - name: Show cloud GUI summary
        if: always()
        run: |
          cat docs/nf-01/evidence/phase-n/cloud-gui-run/cloud-gui-summary.json || true
          cat docs/nf-01/evidence/phase-n/cloud-gui-run/orca-speech-assertions.json || true

      - name: Upload cloud GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nf01-phase-n-cloud-gui-evidence
          path: docs/nf-01/evidence/phase-n/cloud-gui-run/
          if-no-files-found: warn
          retention-days: 30
