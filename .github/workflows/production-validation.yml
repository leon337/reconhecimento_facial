name: Production Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controle_ponto_hml
          POSTGRES_USER: controle_ponto
          POSTGRES_PASSWORD: hml-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle_ponto -d controle_ponto_hml"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: production
      SECRET_KEY: production-validation-secret
      DATABASE_URL: postgresql://controle_ponto:hml-password@127.0.0.1:5432/controle_ponto_hml
      BIOMETRIC_ENCRYPTION_KEY: ${{ secrets.BIOMETRIC_ENCRYPTION_KEY_TEST }}
      PGPASSWORD: hml-password
      PGCONNECT_TIMEOUT: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev liblapack-dev postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Definir chave biométrica sintética
        if: env.BIOMETRIC_ENCRYPTION_KEY == ''
        run: echo "BIOMETRIC_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Validar migrations upgrade downgrade upgrade
        run: |
          flask --app main db upgrade
          flask --app main db downgrade base
          flask --app main db upgrade

      - name: Executar suíte completa de regressão
        env:
          APP_ENV: testing
        run: python -m pytest -q --junitxml=production-validation-report.xml

      - name: Validar domínio e saúde em PostgreSQL
        run: |
          python - <<'PY'
          from main import create_app
          from app.models import Company, Worksite, db

          app = create_app({"TESTING": True, "AUTO_CREATE_SCHEMA": False})
          with app.app_context():
              company = Company(name="Empresa Sintética HML", slug="empresa-sintetica-hml")
              worksite = Worksite(name="Obra Sintética HML", company=company)
              db.session.add_all([company, worksite])
              db.session.commit()
              assert company.id is not None
              assert worksite.company_id == company.id
              db.session.delete(worksite)
              db.session.delete(company)
              db.session.commit()

          client = app.test_client()
          response = client.get('/health')
          assert response.status_code == 200, response.data
          assert response.json['database'] == 'ok'
          security = client.get('/punch')
          assert security.headers['X-Content-Type-Options'] == 'nosniff'
          assert security.headers['X-Frame-Options'] == 'DENY'
          assert 'Content-Security-Policy' in security.headers
          PY

      - name: Preparar fixture sintética para disaster recovery
        env:
          BIOMETRIC_STORAGE_FOLDER: /tmp/controle-ponto-biometrics-source
        run: |
          rm -rf /tmp/controle-ponto-biometrics-source /tmp/controle-ponto-biometrics-restore
          mkdir -p /tmp/controle-ponto-biometrics-source
          python - <<'PY'
          import json
          from main import create_app
          from app.biometric_models import BiometricProfile
          from app.biometrics import encrypt_template, save_private_image_bytes
          from app.models import Company, Employee, User, Worksite, db
          from app.rbac import AccessRole

          app = create_app({
              "TESTING": True,
              "AUTO_CREATE_SCHEMA": False,
              "BIOMETRIC_STORAGE_FOLDER": "/tmp/controle-ponto-biometrics-source",
          })
          with app.app_context():
              company = Company(name="Empresa DR Sintética", slug="empresa-dr-sintetica")
              worksite = Worksite(name="Obra DR Sintética", code="DR-01", company=company)
              employee = Employee(
                  name="Colaborador DR Sintético",
                  registration="DR-001",
                  company=company,
                  worksite=worksite,
              )
              user = User(
                  username="admin-dr",
                  access_role=AccessRole.ADMIN.value,
                  company=company,
                  worksite=worksite,
                  employee=employee,
                  name="Admin DR Sintético",
              )
              user.set_password("senha-dr-sintetica")
              db.session.add_all([company, worksite, employee, user])
              db.session.flush()

              object_key, _ = save_private_image_bytes(b"synthetic-biometric-image", ".bin")
              payload = json.dumps({"encoding": [0.01, 0.02, 0.03], "fixture": "dr"}, sort_keys=True)
              profile = BiometricProfile(
                  user_id=user.id,
                  encrypted_template=encrypt_template(payload),
                  image_object_key=object_key,
                  algorithm_version="synthetic-dr-1",
                  active=True,
              )
              db.session.add(profile)
              db.session.commit()

              assert user.id is not None
              assert user.employee_id == employee.id
              assert profile.id is not None
          PY
          (
            cd /tmp/controle-ponto-biometrics-source
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > biometric-storage.sha256
          test -s biometric-storage.sha256

      - name: Validar cliente PostgreSQL e conexão
        run: |
          pg_dump --version
          pg_isready -h 127.0.0.1 -p 5432 -U controle_ponto -d controle_ponto_hml
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1;'

      - name: Executar script de backup
        run: |
          set -o pipefail
          mkdir -p /tmp/controle-ponto-backups
          BACKUP_DIRECTORY=/tmp/controle-ponto-backups \
            python scripts/backup_postgres.py 2>&1 | tee backup-diagnostic.txt

      - name: Localizar arquivos do backup
        run: |
          archive=$(find /tmp/controle-ponto-backups -name 'database-*.dump' | head -n 1)
          test -n "$archive"
          manifest="${archive%.dump}.manifest.json"
          test -f "$manifest"
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"

      - name: Validar integridade do arquivo de backup
        run: |
          pg_restore --list "$ARCHIVE_PATH" > restore-list.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from app.infrastructure.backup import verify_backup

          verify_backup(Path(os.environ['ARCHIVE_PATH']), Path(os.environ['MANIFEST_PATH']))
          PY

      - name: Preparar restauração do armazenamento biométrico
        run: |
          cp -a /tmp/controle-ponto-biometrics-source /tmp/controle-ponto-biometrics-restore
          (
            cd /tmp/controle-ponto-biometrics-restore
            sha256sum -c "$GITHUB_WORKSPACE/biometric-storage.sha256"
          ) | tee biometric-restore-diagnostic.txt

      - name: Criar banco vazio para restauração
        run: createdb -h 127.0.0.1 -U controle_ponto controle_ponto_restore

      - name: Restaurar backup no banco vazio
        run: |
          set -o pipefail
          start_ms=$(date +%s%3N)
          DATABASE_URL=postgresql://controle_ponto:hml-password@127.0.0.1:5432/controle_ponto_restore \
            python scripts/restore_postgres.py "$ARCHIVE_PATH" --manifest "$MANIFEST_PATH" --confirm RESTORE --fresh-database \
            2>&1 | tee restore-diagnostic.txt
          end_ms=$(date +%s%3N)
          restore_ms=$((end_ms - start_ms))
          echo "CI_DATABASE_RESTORE_DURATION_MS=$restore_ms" | tee restore-metrics.txt
          echo "RESTORE_DURATION_MS=$restore_ms" >> "$GITHUB_ENV"

      - name: Validar schema restaurado
        run: |
          psql -h 127.0.0.1 -U controle_ponto -d controle_ponto_restore -v ON_ERROR_STOP=1 -c 'SELECT 1;'
          test "$(psql -h 127.0.0.1 -U controle_ponto -d controle_ponto_restore -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")" -gt 0

      - name: Validar aplicação, RBAC, biometria e marcação após restore
        env:
          DATABASE_URL: postgresql://controle_ponto:hml-password@127.0.0.1:5432/controle_ponto_restore
          BIOMETRIC_STORAGE_FOLDER: /tmp/controle-ponto-biometrics-restore
        run: |
          python - <<'PY'
          import json
          from io import BytesIO
          from pathlib import Path

          from main import create_app
          from app.biometric_models import BiometricProfile
          from app.biometrics import BiometricCryptoError, decrypt_template
          from app.models import Company, Ponto, User, Worksite
          from app.punch.service import RecognitionResult
          from app.rbac import Permission
          import app.punch.routes as punch_routes

          restored_app = create_app({
              "TESTING": True,
              "AUTO_CREATE_SCHEMA": False,
              "WTF_CSRF_ENABLED": False,
              "BIOMETRIC_STORAGE_FOLDER": "/tmp/controle-ponto-biometrics-restore",
          })

          with restored_app.app_context():
              company = Company.query.filter_by(slug="empresa-dr-sintetica").one()
              worksite = Worksite.query.filter_by(company_id=company.id, code="DR-01").one()
              user = User.query.filter_by(username="admin-dr").one()
              profile = BiometricProfile.query.filter_by(user_id=user.id).one()

              assert user.company_id == company.id
              assert user.worksite_id == worksite.id
              assert user.employee_id is not None
              assert user.check_password("senha-dr-sintetica")
              assert user.can(Permission.USERS_VIEW)
              assert user.can(Permission.PUNCH_CREATE)
              assert profile.active is True
              assert profile.image_object_key
              assert (Path(restored_app.config["BIOMETRIC_STORAGE_FOLDER"]) / profile.image_object_key).is_file()
              decoded = json.loads(decrypt_template(profile.encrypted_template))
              assert decoded["fixture"] == "dr"
              user_id = user.id

          no_key_app = create_app({
              "TESTING": True,
              "AUTO_CREATE_SCHEMA": False,
              "BIOMETRIC_ENCRYPTION_KEY": None,
              "BIOMETRIC_STORAGE_FOLDER": "/tmp/controle-ponto-biometrics-restore",
          })
          with no_key_app.app_context():
              profile = BiometricProfile.query.filter_by(user_id=user_id).one()
              try:
                  decrypt_template(profile.encrypted_template)
              except BiometricCryptoError as exc:
                  assert str(exc) == "biometric_encryption_key_missing"
              else:
                  raise AssertionError("decryption_without_key_should_fail")

          client = restored_app.test_client()
          health = client.get("/health")
          assert health.status_code == 200, health.data
          assert health.get_json()["database"] == "ok"

          login = client.post(
              "/admin/login",
              data={"username": "admin-dr", "password": "senha-dr-sintetica"},
              follow_redirects=False,
          )
          assert login.status_code in {302, 303}, login.data

          def recognize(image, tolerance, company_id=None, worksite_id=None):
              with restored_app.app_context():
                  return RecognitionResult(User.query.filter_by(id=user_id).one(), "matched")

          punch_routes.recognize_registered_user = recognize
          punch = client.post(
              "/punch",
              data={"tipo": "ENTRADA", "image": (BytesIO(b"synthetic-camera-frame"), "captura.jpg")},
              content_type="multipart/form-data",
          )
          assert punch.status_code == 201, punch.data
          assert punch.get_json()["status"] == "ok"

          with restored_app.app_context():
              assert Ponto.query.filter_by(user_id=user_id, tipo="ENTRADA").count() == 1
          PY

      - name: Validar Compose de produção
        env:
          POSTGRES_DB: controle_ponto
          POSTGRES_USER: controle_ponto
          POSTGRES_PASSWORD: validation-password
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Publicar relatório de homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-report
          path: |
            production-validation-report.xml
            backup-diagnostic.txt
            restore-diagnostic.txt
            restore-list.txt
            restore-metrics.txt
            biometric-storage.sha256
            biometric-restore-diagnostic.txt
          if-no-files-found: warn
          retention-days: 14
