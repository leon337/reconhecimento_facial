name: Copiloto - Portal de Credenciais

on:
  pull_request:
    paths:
      - 'services/credential_portal/**'
      - 'app/copilot/routes.py'
      - '.github/workflows/copilot-credential-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências isoladas do portal
        run: pip install -r services/credential_portal/requirements-test.txt

      - name: Testes de proteção, uso único e SQLite criptografado
        run: python -m pytest -q services/credential_portal/tests/

      - name: Validação de sintaxe de arquivos Python
        run: python -m compileall -q services/credential_portal/

      - name: JavaScript de criptografia do navegador
        run: node --check services/credential_portal/static/submit.js
