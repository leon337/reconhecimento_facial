<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#175b43">
  <title>Novo funcionário — Potiguar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-mobile.css') }}">
</head>
<body>
  <div class="container">
    <header class="header">
      <a class="brand" href="{{ url_for('admin.list_users') }}" aria-label="Potiguar — lista de funcionários">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>POTIGUAR</strong><small>Gestão de ponto</small></span>
      </a>
      <nav class="top-actions" aria-label="Navegação principal">
        <a href="{{ url_for('admin.list_users') }}">Funcionários</a>
        <a class="primary" href="{{ url_for('copilot.workspace') }}">✦ Copiloto de IA</a>
      </nav>
    </header>

    <main class="form-panel">
      <div class="page-heading">
        <span class="eyebrow">FUNCIONÁRIOS / NOVO CADASTRO</span>
        <h1>Cadastrar funcionário</h1>
        <p class="subtitle">Preencha as informações necessárias. O cadastro facial é uma etapa separada e exige autorização.</p>
      </div>

      <section class="panel" aria-label="Dados do novo funcionário">
        <form action="{{ url_for('admin.create_user') }}" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-grid">
            <div class="field">
              <label for="username">Usuário de acesso *</label>
              <input id="username" name="username" autocomplete="off" placeholder="Ex.: maria.silva" required maxlength="120">
            </div>
            <div class="field">
              <label for="password">Senha inicial *</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Defina uma senha segura">
            </div>
            <div class="field full">
              <label for="name">Nome completo</label>
              <input id="name" name="name" autocomplete="name" placeholder="Nome e sobrenome">
            </div>
            <div class="field">
              <label for="registration">Matrícula</label>
              <input id="registration" name="registration" placeholder="Identificador funcional">
            </div>
            <div class="field">
              <label for="role">Função</label>
              <input id="role" name="role" placeholder="Ex.: atendente">
            </div>
            <div class="field">
              <label for="schedule">Horário de trabalho</label>
              <input id="schedule" name="schedule" placeholder="Ex.: 08:00–17:00">
            </div>
            <div class="field">
              <label for="pass_type">Tipo de passagem</label>
              <input id="pass_type" name="pass_type" placeholder="Se aplicável">
            </div>
            <div class="field full">
              <label for="address">Endereço residencial</label>
              <input id="address" name="address" autocomplete="street-address" placeholder="Se necessário">
              <p class="help">Evite inserir informações pessoais reais em ambientes de homologação.</p>
            </div>
          </div>
          <div class="form-footer">
            <a class="action" href="{{ url_for('admin.list_users') }}">← Voltar à lista</a>
            <button class="action primary" type="submit">Salvar funcionário</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
